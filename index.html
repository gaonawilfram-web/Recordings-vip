<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Recordings VIP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#111118;--border:#1c1c2a;
  --purple:#a855f7;--pink:#ec4899;--cyan:#22d3ee;
  --text:#e2e8f0;--muted:#64748b;--dark:#0d0d14;
}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
  min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#12061f,#0a0a15,#12061f);
  padding:20px 16px;text-align:center;
  border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,#c084fc,#a855f7,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:var(--muted);font-size:11px;margin-top:4px}
.header .sub a{color:var(--cyan);text-decoration:none}

/* NAV */
.nav{display:flex;overflow-x:auto;background:var(--dark);
  border-bottom:1px solid var(--border);padding:0 8px;gap:4px;
  -webkit-overflow-scrolling:touch}
.nav a{padding:10px 14px;color:var(--muted);text-decoration:none;
  font-size:12px;font-weight:600;white-space:nowrap;
  border-bottom:2px solid transparent;transition:.2s;cursor:pointer}
.nav a.on,.nav a:hover{color:var(--purple);border-color:var(--purple)}

/* STATS */
.stats{display:flex;justify-content:center;gap:24px;padding:12px;
  background:var(--dark);border-bottom:1px solid var(--border);font-size:12px}
.stats span{color:var(--muted)}
.stats b{color:var(--purple)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px;padding:12px;max-width:900px;margin:0 auto}

/* VIDEO CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--purple);transform:translateY(-2px)}
.card .thumb{position:relative;width:100%;padding-top:56.25%;background:#000}
.card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.card .thumb .dur{position:absolute;bottom:6px;right:6px;background:#000c;
  color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.card .thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;background:var(--purple);border-radius:50%;
  display:flex;align-items:center;justify-content:center;opacity:0;
  transition:.2s;box-shadow:0 4px 15px #a855f780}
.card:hover .play-icon{opacity:1}
.card .play-icon::after{content:'';border-style:solid;border-width:8px 0 8px 14px;
  border-color:transparent transparent transparent #fff;margin-left:3px}
.card .info{padding:8px 10px}
.card .info .name{font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info .meta{font-size:11px;color:var(--muted);margin-top:3px}

/* PLAYER PAGE */
.player-page{display:none;max-width:800px;margin:0 auto;padding:14px}
.player-page.on{display:block}
.player-wrap{width:100%;border-radius:12px;overflow:hidden;
  background:#000;position:relative;padding-top:56.25%}
.player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.player-info{padding:14px 0}
.player-info h2{font-size:18px;margin-bottom:10px;color:#fff}
.player-info .detail{font-size:13px;color:var(--muted);line-height:2}
.player-info .detail span{color:var(--text)}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
  background:var(--purple);color:#fff;border-radius:10px;text-decoration:none;
  font-size:13px;font-weight:600;margin-bottom:14px;cursor:pointer;border:none;
  transition:.2s}
.back-btn:hover{background:#9333ea;transform:scale(.97)}

/* TELEGRAM BTN */
.tg-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
  background:#2AABEE;color:#fff;border-radius:10px;text-decoration:none;
  font-size:13px;font-weight:600;margin-top:10px}

/* FOOTER */
.footer{text-align:center;padding:30px 16px;color:var(--muted);font-size:12px;
  border-top:1px solid var(--border);margin-top:40px}
.footer a{color:var(--cyan);text-decoration:none}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}

/* RESPONSIVE */
@media(max-width:400px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
  .header h1{font-size:18px}
}
</style>
</head>
<body>

<div class="header">
  <h1>RECORDINGS VIP</h1>
  <div class="sub">Galeria exclusiva &mdash; <a href="https://t.me/+YdEKx1OxiKM3Nzg5" target="_blank">Unirse al Telegram</a></div>
</div>

<div class="stats">
  <span>Videos: <b id="s-total">0</b></span>
  <span>Modelos: <b id="s-models">0</b></span>
</div>

<div class="nav" id="nav">
  <a class="on" onclick="filter('all')">Todos</a>
</div>

<!-- GALERIA -->
<div class="grid" id="gallery"></div>

<!-- REPRODUCTOR -->
<div class="player-page" id="player">
  <button class="back-btn" onclick="closePlayer()">&#8592; Volver</button>
  <div class="player-wrap">
    <iframe id="iframe" allowfullscreen></iframe>
  </div>
  <div class="player-info">
    <h2 id="p-title"></h2>
    <div class="detail">
      <div>Modelo: <span id="p-model"></span></div>
      <div>Fecha: <span id="p-date"></span></div>
      <div>Duracion: <span id="p-dur"></span></div>
    </div>
    <a class="tg-btn" href="https://t.me/+YdEKx1OxiKM3Nzg5" target="_blank">Unirse al Telegram</a>
  </div>
</div>

<div class="footer">
  <p>Recordings VIP &copy; 2026</p>
  <p style="margin-top:6px"><a href="https://t.me/+YdEKx1OxiKM3Nzg5" target="_blank">Telegram</a></p>
</div>

<script>
let VIDEOS = [];
let currentFilter = 'all';

async function loadVideos(){
  try {
    const r = await fetch('videos.json?t='+Date.now());
    VIDEOS = await r.json();
  } catch(e) { VIDEOS = []; }

  // Stats
  document.getElementById('s-total').textContent = VIDEOS.length;
  document.getElementById('s-models').textContent = [...new Set(VIDEOS.map(v=>v.modelo))].length;

  buildNav();
  render('all');
}

function buildNav(){
  const nav = document.getElementById('nav');
  // Limpiar categorias previas
  nav.innerHTML = '<a class="on" onclick="filter(\'all\')">Todos</a>';
  const cats = [...new Set(VIDEOS.map(v=>v.modelo))].sort();
  cats.forEach(c=>{
    const a=document.createElement('a');
    a.textContent=c;
    a.onclick=()=>filter(c);
    nav.appendChild(a);
  });
}

function filter(cat){
  currentFilter = cat;
  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('on', a.textContent===cat || (cat==='all' && a.textContent==='Todos'));
  });
  render(cat);
}

// Placeholder thumb cuando no hay imagen
const PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect fill='%23111118' width='16' height='9'/%3E%3Ctext x='8' y='5.5' text-anchor='middle' fill='%23333' font-size='2' font-family='sans-serif'%3EVIDEO%3C/text%3E%3C/svg%3E";

function render(cat){
  const g=document.getElementById('gallery');
  const vids = cat==='all' ? VIDEOS : VIDEOS.filter(v=>v.modelo===cat);

  if(!vids.length){
    g.innerHTML='<div class="empty">Sin videos disponibles</div>';
    return;
  }

  g.innerHTML=vids.map((v,i)=>{
    const realIdx = VIDEOS.indexOf(v);
    return `
    <div class="card" onclick="play(${realIdx})">
      <div class="thumb">
        <img src="${v.thumb || PLACEHOLDER}" alt="${v.titulo}" loading="lazy"
             onerror="this.src='${PLACEHOLDER}'">
        <div class="dur">${v.duracion}</div>
        <div class="play-icon"></div>
      </div>
      <div class="info">
        <div class="name">${v.titulo}</div>
        <div class="meta">${v.modelo} &bull; ${v.fecha}</div>
      </div>
    </div>`;
  }).join('');

  g.style.display='grid';
  document.getElementById('player').classList.remove('on');
}

function play(idx){
  const v = VIDEOS[idx];
  document.getElementById('gallery').style.display='none';
  document.getElementById('player').classList.add('on');

  // Streamtape embed URL
  document.getElementById('iframe').src = v.url;

  document.getElementById('p-title').textContent = v.titulo;
  document.getElementById('p-model').textContent = v.modelo;
  document.getElementById('p-date').textContent = v.fecha;
  document.getElementById('p-dur').textContent = v.duracion;
  window.scrollTo({top:0,behavior:'smooth'});
}

function closePlayer(){
  document.getElementById('iframe').src='';
  document.getElementById('player').classList.remove('on');
  document.getElementById('gallery').style.display='grid';
}

loadVideos();
</script>

</html>
