<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Recordings VIP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--card:#111118;--border:#1c1c2a;
  --purple:#a855f7;--pink:#ec4899;--cyan:#22d3ee;
  --text:#e2e8f0;--muted:#64748b;--dark:#0d0d14;
}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
  min-height:100vh}

/* HEADER */
.header{background:linear-gradient(135deg,#12061f,#0a0a15,#12061f);
  padding:20px 16px;text-align:center;
  border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:100}
.header h1{font-size:22px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(90deg,#c084fc,#a855f7,#7c3aed);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{color:var(--muted);font-size:11px;margin-top:4px}
.header .sub a{color:var(--cyan);text-decoration:none}

/* NAV */
.nav{display:flex;overflow-x:auto;background:var(--dark);
  border-bottom:1px solid var(--border);padding:0 8px;gap:4px}
.nav a{padding:10px 14px;color:var(--muted);text-decoration:none;
  font-size:12px;font-weight:600;white-space:nowrap;
  border-bottom:2px solid transparent;transition:.2s}
.nav a.on,.nav a:hover{color:var(--purple);border-color:var(--purple)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;padding:14px;max-width:900px;margin:0 auto}

/* VIDEO CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--purple);transform:translateY(-2px)}
.card .thumb{position:relative;width:100%;padding-top:56.25%;background:#000}
.card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.card .thumb .dur{position:absolute;bottom:6px;right:6px;background:#000c;
  color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700}
.card .thumb .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;background:var(--purple);border-radius:50%;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.card:hover .play{opacity:1}
.card .play::after{content:'';border-style:solid;border-width:8px 0 8px 14px;
  border-color:transparent transparent transparent #fff;margin-left:3px}
.card .info{padding:8px 10px}
.card .info .name{font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info .meta{font-size:11px;color:var(--muted);margin-top:3px}

/* PLAYER PAGE */
.player-page{display:none;max-width:800px;margin:0 auto;padding:14px}
.player-page.on{display:block}
.player-wrap{width:100%;background:#000;border-radius:12px;overflow:hidden}
.player-wrap video{width:100%;display:block}
.player-info{padding:14px 0}
.player-info h2{font-size:18px;margin-bottom:8px}
.player-info .detail{font-size:13px;color:var(--muted);line-height:1.8}
.player-info .detail span{color:var(--text)}
.back-btn{display:inline-block;padding:8px 16px;background:var(--purple);
  color:#fff;border-radius:8px;text-decoration:none;font-size:13px;
  font-weight:600;margin-bottom:14px;cursor:pointer}
.back-btn:hover{background:#9333ea}

/* FOOTER */
.footer{text-align:center;padding:30px 16px;color:var(--muted);font-size:12px;
  border-top:1px solid var(--border);margin-top:40px}
.footer a{color:var(--cyan);text-decoration:none}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}

/* RESPONSIVE */
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}}
</style>
</head>
<body>

<div class="header">
  <h1>RECORDINGS VIP</h1>
  <div class="sub">Galeria exclusiva &mdash; <a href="https://t.me/+YdEKx1OxiKM3Nzg5" target="_blank">Unirse al grupo</a></div>
</div>

<div class="nav" id="nav">
  <a class="on" href="#" onclick="filter('all')">Todos</a>
  <!-- Categorias se generan automatico -->
</div>

<!-- GALERIA -->
<div class="grid" id="gallery"></div>

<!-- REPRODUCTOR -->
<div class="player-page" id="player">
  <div class="back-btn" onclick="closePlayer()">← Volver</div>
  <div class="player-wrap">
    <video id="video" controls playsinline></video>
  </div>
  <div class="player-info">
    <h2 id="p-title"></h2>
    <div class="detail">
      <div>Modelo: <span id="p-model"></span></div>
      <div>Fecha: <span id="p-date"></span></div>
      <div>Duracion: <span id="p-dur"></span></div>
    </div>
  </div>
</div>

<div class="footer">
  <p>Recordings VIP &copy; 2026</p>
  <p><a href="https://t.me/+YdEKx1OxiKM3Nzg5" target="_blank">Telegram</a></p>
</div>

<script>
/*
  VIDEOS: Edita el archivo videos.js para agregar videos.
  Cada video necesita: titulo, modelo, fecha, duracion, thumb, url
*/
let VIDEOS = [];

// Cargar videos desde videos.js
async function loadVideos(){
  try {
    const r = await fetch('videos.json');
    VIDEOS = await r.json();
  } catch(e) {
    VIDEOS = [];
  }
  buildNav();
  render('all');
}

function buildNav(){
  const nav = document.getElementById('nav');
  const cats = [...new Set(VIDEOS.map(v=>v.modelo))];
  cats.sort();
  cats.forEach(c=>{
    const a=document.createElement('a');
    a.href='#';a.textContent=c;
    a.onclick=(e)=>{e.preventDefault();filter(c)};
    nav.appendChild(a);
  });
}

function filter(cat){
  document.querySelectorAll('.nav a').forEach(a=>{
    a.classList.toggle('on',a.textContent===cat || (cat==='all' && a.textContent==='Todos'));
  });
  render(cat);
}

function render(cat){
  const g=document.getElementById('gallery');
  const vids = cat==='all' ? VIDEOS : VIDEOS.filter(v=>v.modelo===cat);
  if(!vids.length){g.innerHTML='<div class="empty">Sin videos</div>';return}
  g.innerHTML=vids.map((v,i)=>`
    <div class="card" onclick="play(${i})">
      <div class="thumb">
        <img src="${v.thumb || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 9%22><rect fill=%22%23111%22 width=%2216%22 height=%229%22/></svg>'}" 
             alt="${v.titulo}" loading="lazy">
        <div class="dur">${v.duracion}</div>
        <div class="play"></div>
      </div>
      <div class="info">
        <div class="name">${v.titulo}</div>
        <div class="meta">${v.modelo} &bull; ${v.fecha}</div>
      </div>
    </div>`).join('');
  // Mostrar galeria, ocultar player
  g.style.display='grid';
  document.getElementById('player').classList.remove('on');
}

function play(idx){
  const v = VIDEOS[idx];
  document.getElementById('gallery').style.display='none';
  document.getElementById('player').classList.add('on');
  const video = document.getElementById('video');
  video.src = v.url;
  video.play().catch(()=>{});
  document.getElementById('p-title').textContent = v.titulo;
  document.getElementById('p-model').textContent = v.modelo;
  document.getElementById('p-date').textContent = v.fecha;
  document.getElementById('p-dur').textContent = v.duracion;
  window.scrollTo(0,0);
}

function closePlayer(){
  document.getElementById('video').pause();
  document.getElementById('video').src='';
  document.getElementById('player').classList.remove('on');
  document.getElementById('gallery').style.display='grid';
}

loadVideos();
</script>
</body>
</html>
