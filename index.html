<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0f">
<meta name="description" content="Recordings VIP - Contenido exclusivo en alta calidad">
<title>Recordings VIP</title>
<link rel="preconnect" href="https://cdn.plyr.io">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070c;--bg2:#0c0c14;--card:#101019;--card2:#14141f;
  --border:#1a1a2e;--border2:#22223a;
  --purple:#a855f7;--purple2:#7c3aed;--purple3:#6d28d9;
  --pink:#ec4899;--cyan:#22d3ee;--green:#10b981;
  --text:#e2e8f0;--text2:#cbd5e1;--muted:#64748b;--dark:#09090f;
  --glow:0 0 30px #a855f715;
  --radius:14px;
}
body{background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;
  min-height:100vh;overflow-x:hidden}
::selection{background:var(--purple);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--purple3);border-radius:5px}

/* HEADER */
.header{
  background:linear-gradient(180deg,#0f051f 0%,var(--bg) 100%);
  padding:28px 16px 20px;text-align:center;position:relative;
  border-bottom:1px solid var(--border)}
.header::before{content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:200px;height:2px;
  background:linear-gradient(90deg,transparent,var(--purple),transparent)}
.logo{font-size:13px;font-weight:800;letter-spacing:6px;
  color:var(--purple);text-transform:uppercase;margin-bottom:4px}
.header h1{font-size:28px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(135deg,#e2e8f0 0%,#c084fc 50%,#a855f7 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.2}
.header .tagline{color:var(--muted);font-size:11px;margin-top:8px;
  letter-spacing:.5px}
.header .tagline a{color:var(--cyan);text-decoration:none;font-weight:600}

/* HERO STATS */
.hero-stats{display:flex;justify-content:center;gap:1px;
  background:var(--border);max-width:400px;margin:0 auto;
  border-radius:var(--radius);overflow:hidden;margin-top:-1px;
  border:1px solid var(--border)}
.hero-stat{background:var(--card);padding:14px 0;flex:1;text-align:center}
.hero-stat b{display:block;font-size:20px;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stat span{font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:1.5px;margin-top:3px;display:block}

/* SEARCH & FILTER BAR */
.filter-bar{padding:12px;background:var(--bg2);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:var(--bg2)ee}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding-bottom:2px;
  scrollbar-width:none;-ms-overflow-style:none}
.filter-scroll::-webkit-scrollbar{display:none}
.pill{padding:7px 16px;color:var(--muted);font-size:11px;font-weight:600;
  white-space:nowrap;border-radius:20px;cursor:pointer;
  border:1px solid var(--border);transition:all .2s;
  background:transparent;user-select:none}
.pill.on{color:#fff;background:var(--purple2);border-color:var(--purple);
  box-shadow:0 2px 12px #7c3aed30}
.pill:hover:not(.on){color:var(--text2);border-color:var(--border2)}

/* SECTION TITLE */
.section{padding:16px 14px 8px;display:flex;align-items:center;
  justify-content:space-between;max-width:1100px;margin:0 auto}
.section h2{font-size:14px;font-weight:700;color:var(--text2)}
.section .count{font-size:11px;color:var(--muted);
  background:var(--card2);padding:3px 10px;border-radius:10px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px;padding:0 14px 14px;max-width:1100px;margin:0 auto}

/* VIDEO CARD */
.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:var(--purple);transform:translateY(-4px);
  box-shadow:0 12px 40px #a855f712}
.card .thumb{position:relative;width:100%;padding-top:56.25%;
  background:linear-gradient(135deg,#0a0a12,#0f0f1a);overflow:hidden}
.card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.card:hover .thumb img{transform:scale(1.08)}
.card .thumb .overlay{position:absolute;inset:0;
  background:linear-gradient(0deg,#000a 0%,transparent 50%);
  opacity:0;transition:.3s}
.card:hover .thumb .overlay{opacity:1}
.card .thumb .dur{position:absolute;bottom:7px;right:7px;
  background:#000b;color:#fff;font-size:10px;padding:3px 8px;
  border-radius:6px;font-weight:700;backdrop-filter:blur(6px);
  letter-spacing:.5px}
.card .thumb .play-btn{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.7);width:50px;height:50px;
  background:linear-gradient(135deg,var(--purple),var(--purple3));
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 25px #a855f770}
.card:hover .play-btn{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card .play-btn::after{content:'';border-style:solid;
  border-width:9px 0 9px 16px;border-color:transparent transparent transparent #fff;
  margin-left:4px}
.card .info{padding:10px 12px 12px}
.card .info .title{font-size:13px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card .info .meta{font-size:10px;color:var(--muted);margin-top:5px;
  display:flex;align-items:center;gap:6px}
.card .info .meta .tag{background:var(--card2);padding:2px 7px;
  border-radius:6px;font-weight:600;color:var(--purple);font-size:9px}
.card .info .meta .dot{width:3px;height:3px;background:var(--muted);
  border-radius:50%}

/* PLAYER PAGE */
.player-page{display:none;max-width:850px;margin:0 auto;padding:14px}
.player-page.on{display:block}
.player-container{border-radius:var(--radius);overflow:hidden;
  background:#000;box-shadow:0 8px 50px #000a}
.player-container video{width:100%;display:block}
.player-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  background:var(--card);color:var(--text2);border-radius:10px;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);transition:.2s}
.back-btn:hover{border-color:var(--purple);color:#fff}
.player-details{padding:18px 0}
.player-details h2{font-size:20px;font-weight:700;margin-bottom:14px;
  line-height:1.3;color:#fff}
.info-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.info-card{background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px}
.info-card .ic-label{font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.info-card .ic-value{font-size:15px;font-weight:700;color:#fff;margin-top:4px}
.info-card.purple .ic-value{color:var(--purple)}

/* CTA SECTION */
.cta{margin-top:18px;padding:20px;text-align:center;
  background:linear-gradient(135deg,var(--card) 0%,#14102a 100%);
  border:1px solid var(--border2);border-radius:var(--radius)}
.cta p{color:var(--muted);font-size:12px;margin-bottom:12px}
.cta-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 28px;
  background:linear-gradient(135deg,#2AABEE,#229ED9);color:#fff;
  border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;
  transition:all .2s;border:none;cursor:pointer}
.cta-btn:hover{transform:scale(.97);box-shadow:0 6px 20px #2AABEE30}
.cta-btn svg{width:18px;height:18px;fill:#fff}

/* FLOATING TELEGRAM BUTTON */
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;
  background:linear-gradient(135deg,#2AABEE,#229ED9);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px #2AABEE50;z-index:200;
  text-decoration:none;transition:all .3s cubic-bezier(.4,0,.2,1);
  animation:fab-pulse 3s infinite}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 30px #2AABEE70}
.fab:active{transform:scale(.95)}
.fab svg{width:26px;height:26px;fill:#fff}
@keyframes fab-pulse{
  0%,100%{box-shadow:0 4px 20px #2AABEE50}
  50%{box-shadow:0 4px 30px #2AABEE80,0 0 0 8px #2AABEE15}
}

/* PLYR */
.plyr{--plyr-color-main:#a855f7;--plyr-video-background:#000;
  --plyr-range-fill-background:#a855f7;
  --plyr-video-control-color:#fff;
  --plyr-video-control-color-hover:#fff;
  --plyr-video-control-background-hover:#a855f730;
  border-radius:var(--radius);overflow:hidden}
.plyr__control--overlaid{
  background:linear-gradient(135deg,#a855f7,#7c3aed)!important;
  box-shadow:0 4px 25px #a855f760!important;
  padding:20px!important;border-radius:50%!important;
  opacity:.9!important;transition:.3s!important}
.plyr__control--overlaid:hover{
  opacity:1!important;transform:scale(1.1)!important}
.plyr__controls{
  background:linear-gradient(transparent,#000a 30%,#000d)!important;
  padding:12px 14px 10px!important}
.plyr__progress input[type=range]{color:#a855f7}
.plyr__volume input[type=range]{color:#a855f7}
.plyr__time{font-size:12px!important;font-weight:600!important}
.plyr__menu__container{background:#14141f!important;
  border:1px solid #22223a!important;border-radius:10px!important}
.plyr__menu__container label{color:#e2e8f0!important}

/* FOOTER */
.footer{text-align:center;padding:30px 16px 90px;font-size:11px;
  border-top:1px solid var(--border);margin-top:40px;color:var(--muted)}
.footer a{color:var(--cyan);text-decoration:none}
.footer .brand{font-size:13px;font-weight:700;color:var(--text2);
  letter-spacing:2px;margin-bottom:6px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
.empty svg{width:48px;height:48px;fill:var(--border);margin-bottom:12px}

/* RESPONSIVE */
@media(max-width:500px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:0 8px 8px}
  .header h1{font-size:22px}
  .header{padding:22px 14px 16px}
  .info-cards{grid-template-columns:1fr 1fr}
  .fab{bottom:18px;right:14px;width:50px;height:50px}
  .fab svg{width:22px;height:22px}
}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
let VIDEOS=[];
let plyrInstance=null;

const PH="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230a0a12'/%3E%3Cstop offset='100%25' stop-color='%23101019'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='url(%23g)' width='16' height='9'/%3E%3C/svg%3E";

async function loadVideos(){
  try{const r=await fetch('videos.json?t='+Date.now());VIDEOS=await r.json()}
  catch(e){VIDEOS=[]}
  document.getElementById('s-total').textContent=VIDEOS.length;
  const models=[...new Set(VIDEOS.map(v=>v.modelo))];
  document.getElementById('s-models').textContent=models.length;
  buildNav(models);render('all');
}

function buildNav(models){
  const nav=document.getElementById('nav');
  nav.innerHTML='<div class="pill on" onclick="filter(\'all\')">Todos</div>';
  models.sort().forEach(c=>{
    const p=document.createElement('div');
    p.className='pill';p.textContent=c;
    p.onclick=()=>filter(c);nav.appendChild(p);
  });
}

function filter(cat){
  document.querySelectorAll('.pill').forEach(p=>{
    p.classList.toggle('on',p.textContent===cat||(cat==='all'&&p.textContent==='Todos'));
  });
  render(cat);
}

function render(cat){
  const g=document.getElementById('gallery');
  const vids=cat==='all'?VIDEOS:VIDEOS.filter(v=>v.modelo===cat);
  document.getElementById('showing').textContent=vids.length+' videos';
  if(!vids.length){
    g.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M21 5H3a1 1 0 00-1 1v12a1 1 0 001 1h18a1 1 0 001-1V6a1 1 0 00-1-1zm-1 12H4V7h16v10zm-5-7l-4 3V7l4 3z"/></svg><br>Sin videos disponibles</div>';
    return;
  }
  g.innerHTML=vids.map(v=>{
    const idx=VIDEOS.indexOf(v);
    return `
    <div class="card" onclick="play(${idx})">
      <div class="thumb">
        <img src="${v.thumb||PH}" alt="${v.titulo}" loading="lazy" onerror="this.src='${PH}'">
        <div class="overlay"></div>
        <div class="dur">${v.duracion}</div>
        <div class="play-btn"></div>
      </div>
      <div class="info">
        <div class="title">${v.titulo}</div>
        <div class="meta">
          <span class="tag">${v.modelo}</span>
          <span class="dot"></span>
          <span>${v.fecha}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  g.style.display='grid';
  document.getElementById('player').classList.remove('on');
}

function play(idx){
  const v=VIDEOS[idx];
  document.getElementById('gallery').style.display='none';
  document.querySelector('.filter-bar').style.display='none';
  document.querySelector('.section').style.display='none';
  document.getElementById('fab').style.display='none';
  document.getElementById('player').classList.add('on');
  const video=document.getElementById('video');
  video.src=v.url;
  if(plyrInstance){try{plyrInstance.destroy()}catch(e){}}
  plyrInstance=new Plyr(video,{
    controls:['play-large','play','progress','current-time','duration',
              'mute','volume','settings','fullscreen'],
    settings:['speed'],
    speed:{selected:1,options:[0.5,0.75,1,1.25,1.5,2]},
    tooltips:{controls:true,seek:true},
    keyboard:{focused:true,global:true},
    iconUrl:'https://cdn.plyr.io/3.7.8/plyr.svg'
  });
  document.getElementById('p-title').textContent=v.titulo;
  document.getElementById('p-model').textContent=v.modelo;
  document.getElementById('p-date').textContent=v.fecha;
  document.getElementById('p-dur').textContent=v.duracion;
  // Guardar en URL para que recarga funcione
  history.pushState(null,'','#video/'+idx);
  window.scrollTo({top:0,behavior:'smooth'});
}

function closePlayer(){
  if(plyrInstance){try{plyrInstance.destroy()}catch(e){}}
  const v=document.getElementById('video');v.pause();v.src='';
  document.getElementById('player').classList.remove('on');
  document.getElementById('gallery').style.display='grid';
  document.querySelector('.filter-bar').style.display='';
  document.querySelector('.section').style.display='';
  document.getElementById('fab').style.display='';
  // Volver a URL limpia
  history.pushState(null,'','#');
}

// Detectar hash al cargar o al navegar atras
function checkHash(){
  const h=location.hash;
  if(h.startsWith('#video/')){
    const idx=parseInt(h.split('/')[1]);
    if(!isNaN(idx)&&idx>=0&&idx<VIDEOS.length) play(idx);
  }
}
window.addEventListener('hashchange',checkHash);

async function init(){
  await loadVideos();
  checkHash();
}
init();
</script>
