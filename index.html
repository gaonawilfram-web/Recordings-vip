<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#08080d">
<title>Recordings VIP</title>
<link rel="preconnect" href="https://cdn.plyr.io">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070c;--bg2:#0b0b13;--card:#0e0e18;--card2:#121220;
  --border:#161628;--border2:#1e1e36;
  --p:#a855f7;--p2:#7c3aed;--p3:#6d28d9;--pg:#a855f720;
  --pk:#ec4899;--cy:#22d3ee;--gn:#10b981;
  --t:#e2e8f0;--t2:#94a3b8;--mt:#4b5563;
  --r:12px;
}
body{background:var(--bg);color:var(--t);
  font-family:-apple-system,system-ui,'Segoe UI',sans-serif;
  min-height:100vh;overflow-x:hidden}
::selection{background:var(--p);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--p3);border-radius:4px}

/* ─── HEADER ─── */
.hd{background:linear-gradient(180deg,#0d041a,var(--bg));
  padding:20px 16px 0;text-align:center;position:relative}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--p2),transparent)}
.hd .logo{font-size:11px;font-weight:800;letter-spacing:6px;color:var(--p);
  text-transform:uppercase}
.hd h1{font-size:26px;font-weight:800;margin:2px 0 6px;
  background:linear-gradient(135deg,#fff 30%,var(--p));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd .tg{color:var(--mt);font-size:10px;margin-bottom:14px}
.hd .tg a{color:var(--cy);text-decoration:none;font-weight:600}

/* ─── SEARCH ─── */
.search-wrap{max-width:500px;margin:0 auto;padding:0 16px 16px;position:relative}
.search-box{display:flex;background:var(--card2);border:1px solid var(--border2);
  border-radius:30px;overflow:hidden;transition:.3s}
.search-box:focus-within{border-color:var(--p);box-shadow:0 0 20px var(--pg)}
.search-box input{flex:1;background:transparent;border:none;color:#fff;
  padding:12px 18px;font-size:14px;outline:none}
.search-box input::placeholder{color:var(--mt)}
.search-box button{background:var(--p2);border:none;color:#fff;
  padding:0 18px;cursor:pointer;transition:.2s;display:flex;align-items:center}
.search-box button:hover{background:var(--p)}
.search-box button svg{width:18px;height:18px;fill:#fff}
.search-results{position:absolute;top:100%;left:16px;right:16px;
  background:var(--card2);border:1px solid var(--border2);border-radius:var(--r);
  max-height:250px;overflow-y:auto;display:none;z-index:95;
  box-shadow:0 10px 40px #0008}
.search-results.on{display:block}
.sr-item{padding:10px 16px;cursor:pointer;display:flex;align-items:center;
  gap:10px;border-bottom:1px solid var(--border);transition:.15s}
.sr-item:hover{background:var(--p2)20}
.sr-item:last-child{border:none}
.sr-item .sr-name{font-size:13px;font-weight:600;color:#fff}
.sr-item .sr-count{font-size:10px;color:var(--t2);margin-left:auto}
.sr-item .sr-dot{width:8px;height:8px;background:var(--p);border-radius:50%}
.sr-empty{padding:16px;text-align:center;color:var(--mt);font-size:12px}

/* ─── STATS ─── */
.stats{display:flex;justify-content:center;gap:1px;max-width:420px;
  margin:-1px auto 0;background:var(--border);border-radius:0 0 var(--r) var(--r);
  overflow:hidden;border:1px solid var(--border);border-top:none}
.stat{background:var(--card);padding:12px 0;flex:1;text-align:center}
.stat b{display:block;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,var(--p),var(--pk));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:8px;color:var(--mt);text-transform:uppercase;
  letter-spacing:1.5px;display:block;margin-top:2px}

/* ─── FILTER ─── */
.fbar{padding:10px 12px;background:var(--bg2)ee;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:90;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.fscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.fscroll::-webkit-scrollbar{display:none}
.pill{padding:6px 14px;color:var(--mt);font-size:10px;font-weight:700;
  white-space:nowrap;border-radius:20px;cursor:pointer;
  border:1px solid var(--border);transition:.2s;background:transparent;
  text-transform:uppercase;letter-spacing:.5px}
.pill.on{color:#fff;background:var(--p2);border-color:var(--p);
  box-shadow:0 2px 12px #7c3aed30}
.pill:hover:not(.on){border-color:var(--border2);color:var(--t2)}

/* ─── SECTION ─── */
.sec{padding:14px 14px 8px;display:flex;align-items:center;
  justify-content:space-between;max-width:1100px;margin:0 auto}
.sec h2{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.5px}
.sec .cnt{font-size:10px;color:var(--mt);background:var(--card2);
  padding:3px 10px;border-radius:10px;font-weight:600}

/* ─── GRID ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;padding:0 14px 14px;max-width:1100px;margin:0 auto}

/* ─── CARD ─── */
.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1)}
.card:hover{border-color:var(--p);transform:translateY(-4px);
  box-shadow:0 12px 40px var(--pg)}
.card .th{position:relative;width:100%;padding-top:56.25%;
  background:var(--card2);overflow:hidden}
.card .th img{position:absolute;top:0;left:0;width:100%;height:100%;
  object-fit:cover;transition:.4s cubic-bezier(.4,0,.2,1)}
.card:hover .th img{transform:scale(1.06)}
.card .th .ov{position:absolute;inset:0;
  background:linear-gradient(0deg,#000a,transparent 50%);opacity:0;transition:.3s}
.card:hover .th .ov{opacity:1}
.card .th .dr{position:absolute;bottom:6px;right:6px;background:#000b;
  color:#fff;font-size:9px;padding:3px 7px;border-radius:5px;
  font-weight:700;backdrop-filter:blur(6px);letter-spacing:.5px}
.card .th .pb{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.7);width:46px;height:46px;
  background:linear-gradient(135deg,var(--p),var(--p3));border-radius:50%;
  display:flex;align-items:center;justify-content:center;opacity:0;
  transition:.3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 25px #a855f770}
.card:hover .pb{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card .pb::after{content:'';border-style:solid;border-width:8px 0 8px 14px;
  border-color:transparent transparent transparent #fff;margin-left:3px}
.card .nf{padding:10px 11px 11px}
.card .nf .tt{font-size:12px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.card .nf .mt{font-size:9px;color:var(--mt);margin-top:4px;
  display:flex;align-items:center;gap:5px}
.card .nf .tg{background:var(--p2)25;padding:2px 6px;border-radius:4px;
  font-weight:700;color:var(--p);font-size:8px;letter-spacing:.3px}
.card .nf .dt{width:2px;height:2px;background:var(--mt);border-radius:50%}

/* ─── PLAYER ─── */
.pp{display:none;max-width:850px;margin:0 auto;padding:14px}
.pp.on{display:block}
.pc{border-radius:var(--r);overflow:hidden;background:#000;
  box-shadow:0 8px 50px #000a}
.pc video{width:100%;display:block}
.pd{padding:16px 0}
.pd h2{font-size:18px;font-weight:700;margin-bottom:12px;color:#fff}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ic{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px}
.ic .il{font-size:8px;color:var(--mt);text-transform:uppercase;
  letter-spacing:1.5px;font-weight:700}
.ic .iv{font-size:14px;font-weight:700;color:#fff;margin-top:3px}
.ic.pu .iv{color:var(--p)}
.bk{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  background:var(--card);color:var(--t2);border-radius:10px;font-size:12px;
  font-weight:600;cursor:pointer;border:1px solid var(--border);
  transition:.2s;margin-bottom:14px}
.bk:hover{border-color:var(--p);color:#fff}
.ct{margin-top:16px;padding:18px;text-align:center;
  background:linear-gradient(135deg,var(--card),#110e24);
  border:1px solid var(--border2);border-radius:var(--r)}
.ct p{color:var(--mt);font-size:11px;margin-bottom:10px}
.ctb{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;
  background:linear-gradient(135deg,#2AABEE,#229ED9);color:#fff;
  border-radius:10px;text-decoration:none;font-size:12px;font-weight:700;
  transition:.2s;border:none;cursor:pointer}
.ctb:hover{transform:scale(.97);box-shadow:0 4px 16px #2AABEE30}
.ctb svg{width:16px;height:16px;fill:#fff}

/* ─── PLYR ─── */
.plyr{--plyr-color-main:var(--p);border-radius:var(--r);overflow:hidden}
.plyr__control--overlaid{
  background:linear-gradient(135deg,var(--p),var(--p3))!important;
  box-shadow:0 4px 25px #a855f760!important;padding:20px!important;
  border-radius:50%!important;opacity:.9!important}
.plyr__control--overlaid:hover{opacity:1!important;transform:scale(1.1)!important}
.plyr__controls{background:linear-gradient(transparent,#000a 30%,#000d)!important;
  padding:12px 14px 10px!important}
.plyr__time{font-size:12px!important;font-weight:600!important}
.plyr__menu__container{background:var(--card2)!important;
  border:1px solid var(--border2)!important;border-radius:10px!important}

/* ─── FAB ─── */
.fab{position:fixed;bottom:22px;right:18px;width:52px;height:52px;
  background:linear-gradient(135deg,#2AABEE,#229ED9);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px #2AABEE50;z-index:200;text-decoration:none;
  transition:all .3s;animation:fp 3s infinite}
.fab:hover{transform:scale(1.1)}
.fab:active{transform:scale(.95)}
.fab svg{width:24px;height:24px;fill:#fff}
@keyframes fp{0%,100%{box-shadow:0 4px 20px #2AABEE50}
  50%{box-shadow:0 4px 28px #2AABEE80,0 0 0 8px #2AABEE12}}

/* ─── FOOTER ─── */
.ft{text-align:center;padding:28px 16px 88px;font-size:10px;
  border-top:1px solid var(--border);margin-top:36px;color:var(--mt)}
.ft a{color:var(--cy);text-decoration:none}
.ft .br{font-size:12px;font-weight:700;color:var(--t2);
  letter-spacing:2px;margin-bottom:4px}

.empty{text-align:center;padding:50px 20px;color:var(--mt);font-size:12px}

@media(max-width:500px){
  .grid{grid-template-columns:1fr;gap:10px;padding:0 10px 10px}
  .hd h1{font-size:22px}
  .fab{bottom:16px;right:14px;width:48px;height:48px}
  .card .nf .tt{font-size:14px}
  .card .nf .mt{font-size:10px}
  .card .th .dr{font-size:11px;padding:4px 9px}
}
@media(min-width:501px) and (max-width:767px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:768px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
let V=[],plyr=null;
const PH="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect fill='%230e0e18' width='16' height='9'/%3E%3C/svg%3E";

async function loadVideos(){
  try{V=await(await fetch('videos.json?t='+Date.now())).json()}catch(e){V=[]}
  document.getElementById('s-total').textContent=V.length;
  const m=[...new Set(V.map(v=>v.modelo))];
  document.getElementById('s-models').textContent=m.length;
  buildNav(m);render('all');
}

function buildNav(m){
  const n=document.getElementById('nav');
  n.innerHTML='<div class="pill on" onclick="filter(\'all\')">Todos</div>';
  m.sort().forEach(c=>{const p=document.createElement('div');
    p.className='pill';p.textContent=c;p.onclick=()=>filter(c);n.appendChild(p)});
}

function filter(c){
  document.querySelectorAll('.pill').forEach(p=>
    p.classList.toggle('on',p.textContent===c||(c==='all'&&p.textContent==='Todos')));
  render(c);
}

// ── SEARCH ──
function onSearch(){
  const q=document.getElementById('sinput').value.trim().toLowerCase();
  const sr=document.getElementById('sresults');
  if(!q){sr.classList.remove('on');return}
  // Buscar modelos que coincidan
  const models=[...new Set(V.map(v=>v.modelo))];
  const match=models.filter(m=>m.toLowerCase().includes(q));
  if(!match.length){
    sr.innerHTML='<div class="sr-empty">Sin resultados</div>';
    sr.classList.add('on');return;
  }
  sr.innerHTML=match.map(m=>{
    const cnt=V.filter(v=>v.modelo===m).length;
    return `<div class="sr-item" onclick="pickModel('${m}')">
      <div class="sr-dot"></div>
      <div class="sr-name">${m}</div>
      <div class="sr-count">${cnt} video${cnt>1?'s':''}</div>
    </div>`;
  }).join('');
  sr.classList.add('on');
}
function doSearch(){
  const q=document.getElementById('sinput').value.trim().toLowerCase();
  if(!q)return;
  const m=[...new Set(V.map(v=>v.modelo))].find(m=>m.toLowerCase().includes(q));
  if(m)pickModel(m); else{filter('all');closeSR()}
}
function pickModel(m){
  filter(m);closeSR();
  document.getElementById('sinput').value=m;
}
function closeSR(){document.getElementById('sresults').classList.remove('on')}
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap'))closeSR()});

// ── RENDER ──
function render(c){
  const g=document.getElementById('gallery');
  const vids=c==='all'?V:V.filter(v=>v.modelo===c);
  document.getElementById('showing').textContent=vids.length+' videos';
  if(!vids.length){g.innerHTML='<div class="empty">Sin videos</div>';return}
  g.innerHTML=vids.map(v=>{const i=V.indexOf(v);return `
    <div class="card" onclick="play(${i})">
      <div class="th">
        <img src="${v.thumb||PH}" alt="${v.titulo}" loading="lazy" onerror="this.src='${PH}'">
        <div class="ov"></div><div class="dr">${v.duracion}</div><div class="pb"></div>
      </div>
      <div class="nf">
        <div class="tt">${v.titulo}</div>
        <div class="mt"><span class="tg">${v.modelo}</span><span class="dt"></span><span>${v.fecha}</span></div>
      </div>
    </div>`}).join('');
  g.style.display='grid';
  document.getElementById('player').classList.remove('on');
}

// ── PLAYER ──
function play(i){
  const v=V[i];
  document.getElementById('gallery').style.display='none';
  document.querySelector('.fbar').style.display='none';
  document.querySelector('.sec').style.display='none';
  document.getElementById('fab').style.display='none';
  document.getElementById('player').classList.add('on');
  const vid=document.getElementById('video');vid.src=v.url;
  if(plyr){try{plyr.destroy()}catch(e){}}
  plyr=new Plyr(vid,{
    controls:['play-large','play','progress','current-time','duration',
              'mute','volume','settings','fullscreen'],
    settings:['speed'],speed:{selected:1,options:[.5,.75,1,1.25,1.5,2]},
    tooltips:{controls:!0,seek:!0},keyboard:{focused:!0,global:!0},
    iconUrl:'https://cdn.plyr.io/3.7.8/plyr.svg'});
  document.getElementById('p-title').textContent=v.titulo;
  document.getElementById('p-model').textContent=v.modelo;
  document.getElementById('p-date').textContent=v.fecha;
  document.getElementById('p-dur').textContent=v.duracion;
  history.pushState(null,'','#video/'+i);
  window.scrollTo({top:0,behavior:'smooth'});
}
function closePlayer(){
  if(plyr){try{plyr.destroy()}catch(e){}}
  const v=document.getElementById('video');v.pause();v.src='';
  document.getElementById('player').classList.remove('on');
  document.getElementById('gallery').style.display='grid';
  document.querySelector('.fbar').style.display='';
  document.querySelector('.sec').style.display='';
  document.getElementById('fab').style.display='';
  history.pushState(null,'','#');
}
function checkHash(){
  const h=location.hash;
  if(h.startsWith('#video/')){const i=parseInt(h.split('/')[1]);
    if(!isNaN(i)&&i>=0&&i<V.length)play(i)}
}
window.addEventListener('hashchange',checkHash);
